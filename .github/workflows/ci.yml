name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax-check the app's JavaScript
        run: for f in js/*.js sw.js scripts/*.mjs; do node --check "$f" || exit 1; done
      - name: Validate JSON files
        run: node -e "for (const f of ['manifest.webmanifest','capacitor.config.json','package.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Build the web bundle
        run: node scripts/build-web.mjs
