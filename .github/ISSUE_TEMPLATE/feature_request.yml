name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the task you're trying to get done, not just the solution.
      placeholder: I often need to... but right now I have to...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the app help?
  - type: textarea
    id: alternatives
    attributes:
      label: Other apps or workarounds you've tried
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
